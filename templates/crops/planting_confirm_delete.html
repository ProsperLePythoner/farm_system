{% extends "base/base.html" %}

{% block title %}Delete Planting{% endblock %}

{% block content %}

<h1>Delete Planting</h1>

<p>
    Are you sure you want to delete
    <strong>{{ planting }}</strong>?
</p>

{% if delete_blocked %}
<p class="form-errors">{{ blocked_message }}</p>
<a class="button button-secondary" href="{% url 'crops:planting-detail' planting.pk %}">Return to planting</a>
{% else %}
<form method="post" class="form-card">

    {% csrf_token %}

    <div class="form-actions">
        <button class="button-danger button-solid" type="submit">{% include "base/icon.html" with icon="delete" %}Yes, delete</button>

        <a class="button button-secondary" href="{% url 'crops:planting-detail' planting.pk %}">Cancel</a>
    </div>

</form>
{% endif %}

{% endblock %}
