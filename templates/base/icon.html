{% if icon == "add" %}
<svg class="action-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false">
    <path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>
{% elif icon == "edit" %}
<svg class="action-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false">
    <path d="m12.5 4.5 3 3M4 16l3.5-.8L15.7 7a1.4 1.4 0 0 0-2-2l-8.2 8.2L4 16Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
{% elif icon == "delete" %}
<svg class="action-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false">
    <path d="M4.5 6h11M8 6V4.5h4V6m2 0-.6 9.5H6.6L6 6m2.5 2.2v5m3-5v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
{% elif icon == "lock" %}
<svg class="action-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false">
    <rect x="4.5" y="8" width="11" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
    <path d="M7 8V6a3 3 0 0 1 6 0v2m-3 3v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>
{% elif icon == "harvest" %}
<svg class="action-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false">
    <path d="M10 16V8m0 2C6 10 4.5 7.5 4.5 5c3.7 0 5.5 1.2 5.5 5Zm0 1c0-3.8 2-5.8 5.5-6 0 3.8-1.8 6-5.5 6Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
{% endif %}
